apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
  namespace: honeymesh
  labels:
    app: cowrie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cowrie
  template:
    metadata:
      labels:
        app: cowrie
    spec:
      containers:
        - name: cowrie
          image: vitrag00/honeymesh-cowrie:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2222
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: cowrie-logs
              mountPath: /cowrie/var/log/cowrie
      volumes:
        - name: cowrie-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cowrie-service
  namespace: honeymesh
spec:
  selector:
    app: cowrie
  ports:
    - protocol: TCP
      port: 2222
      targetPort: 2222
  type: LoadBalancer
