global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: honeymesh-dashboard
    static_configs:
      - targets:
          - localhost:5000

  - job_name: cowrie-metrics
    static_configs:
      - targets:
          - localhost:2222

  - job_name: node-exporter
    static_configs:
      - targets:
          - localhost:9100
